# Builds unsigned desktop bundles. The default "artifacts" channel keeps them as workflow
# artifacts. "nightly" (from develop) and "release" (from main) also run the full CI gate
# and publish a GitHub release; see docs/development/releases.md.
name: package
run-name: package ${{ inputs.channel }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "artifacts: workflow artifacts only; nightly: rolling prerelease from develop; release: main's manifest version"
        type: choice
        options: [artifacts, nightly, release]
        default: artifacts

permissions:
  contents: read

concurrency:
  group: package-${{ inputs.channel }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  OPENSSL_NO_VENDOR: "0"
  # Tauri runs Cargo from src-tauri; keep build, cache and upload paths aligned.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/packaging-ci

jobs:
  prepare:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Release tags decide which versions are still unreleased.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Select the version for this channel
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          case "$CHANNEL" in
            artifacts)
              version="$(python3 scripts/release_version.py show)" ;;
            nightly)
              if [[ "$GITHUB_REF" != refs/heads/develop ]]; then
                echo "::error::Nightly builds are published only from develop"
                exit 1
              fi
              version="$(python3 scripts/release_version.py nightly --date "$(date -u +%Y%m%d)" --run "$RUN_NUMBER")" ;;
            release)
              if [[ "$GITHUB_REF" != refs/heads/main ]]; then
                echo "::error::Releases are published only from main"
                exit 1
              fi
              version="$(python3 scripts/release_version.py release)" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Channel \`$CHANNEL\`, version \`$version\`, commit \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: quality gate
    if: inputs.channel != 'artifacts'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: unsigned bundle (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-nsis
            os: windows-latest
            bundles: nsis
            artifact-path: target/packaging-ci/release/bundle/nsis/
          - name: macos-app-dmg
            os: macos-latest
            bundles: app,dmg
            artifact-path: |
              target/packaging-ci/release/bundle/macos/
              target/packaging-ci/release/bundle/dmg/
          - name: linux-deb-appimage
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact-path: |
              target/packaging-ci/release/bundle/deb/
              target/packaging-ci/release/bundle/appimage/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            perl \
            wget
      - name: Select native Windows Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (!(Test-Path $perl)) { $perl = (Get-Command perl.exe -ErrorAction Stop).Source }
          & $perl -e 'exit($^O eq "MSWin32" ? 0 : 1)'
          if ($LASTEXITCODE -ne 0) { throw 'Vendored OpenSSL requires native Windows Perl, such as Strawberry Perl.' }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/packaging-ci"
      - run: npm ci
      # After the caches are keyed, so a nightly stamp does not create a new cache entry.
      - uses: actions/setup-python@v7
        if: inputs.channel == 'nightly'
        with:
          python-version: "3.11"
      - name: Stamp the nightly version
        if: inputs.channel == 'nightly'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release_version.py set "$VERSION"
      - name: Build unsigned bundles
        run: npx tauri build --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify macOS application bundle signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "$CARGO_TARGET_DIR/release/bundle/macos/Vibe Tox LIS.app"
      - name: Check macOS executable has no dynamic OpenSSL dependency
        if: runner.os == 'macOS'
        run: |
          otool -L "$CARGO_TARGET_DIR/release/lis-desktop" > "$RUNNER_TEMP/lis-libraries.txt"
          cat "$RUNNER_TEMP/lis-libraries.txt"
          if grep -E 'lib(ssl|crypto)[^/]*\.dylib' "$RUNNER_TEMP/lis-libraries.txt"; then
            exit 1
          fi
      - name: Check Linux executable has no dynamic OpenSSL dependency
        if: runner.os == 'Linux'
        run: |
          readelf -d "$CARGO_TARGET_DIR/release/lis-desktop" > "$RUNNER_TEMP/lis-libraries.txt"
          if grep -E 'NEEDED.*lib(ssl|crypto)' "$RUNNER_TEMP/lis-libraries.txt"; then
            exit 1
          fi
      - name: Check Windows executable has no OpenSSL DLL dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw 'MSVC dumpbin is required to inspect the packaged executable.' }
          $libraries = & $dumpbin /DEPENDENTS "$env:CARGO_TARGET_DIR/release/lis-desktop.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect executable dependencies.' }
          $libraries
          if ($libraries -match '(?i)(libcrypto|libssl|ssleay32|libeay32).*\.dll') {
            throw 'OpenSSL must be statically linked into the desktop executable.'
          }
      - name: Upload unsigned bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish ${{ inputs.channel }}
    needs: [prepare, gate, build]
    if: inputs.channel != 'artifacts'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bundles
      - name: Name installers and write checksums
        run: |
          mkdir release
          stage() {
            mapfile -t found < <(find bundles -type f -name "$1")
            if [[ ${#found[@]} -ne 1 ]]; then
              echo "::error::Expected one $1 bundle, found ${#found[@]}"
              exit 1
            fi
            cp "${found[0]}" "release/vibe-tox-lis_${VERSION}_$2"
          }
          stage '*_x64-setup.exe' windows-x64-setup.exe
          stage '*_aarch64.dmg' macos-arm64.dmg
          stage '*_amd64.deb' linux-amd64.deb
          stage '*_amd64.AppImage' linux-amd64.AppImage
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
      - name: Write release notes
        run: |
          source_url="$GITHUB_SERVER_URL/$GH_REPO/blob/$GITHUB_SHA"
          {
            if [[ "$CHANNEL" == nightly ]]; then
              echo "Nightly build \`$VERSION\` of \`develop\` at $GITHUB_SHA. Each newer nightly replaces this prerelease."
              previous="$(gh release view nightly --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
              if [[ -n "$previous" && "$previous" != "$GITHUB_SHA" ]]; then
                echo
                echo "Changes since the previous nightly: $GITHUB_SERVER_URL/$GH_REPO/compare/$previous...$GITHUB_SHA"
              fi
            else
              echo "Vibe Tox LIS \`$VERSION\` from \`main\` at $GITHUB_SHA."
            fi
            cat <<EOF

          > [!WARNING]
          > Development build for evaluation with synthetic data only. It is not validated for clinical use, is not a supported release, and its installers are unsigned. Read the [development disclaimer]($source_url/docs/governance/development-disclaimer.md) before use.

          | System | Download |
          | --- | --- |
          | Windows x64 | \`vibe-tox-lis_${VERSION}_windows-x64-setup.exe\` (installs for the current user) |
          | macOS 15 or later, Apple silicon | \`vibe-tox-lis_${VERSION}_macos-arm64.dmg\` |
          | Linux x64 | \`vibe-tox-lis_${VERSION}_linux-amd64.deb\` or the portable \`vibe-tox-lis_${VERSION}_linux-amd64.AppImage\` |

          Windows SmartScreen warns before installation. The macOS app has an ad-hoc bundle signature for development; it is not Developer ID signed or notarized. Copy it to Applications, attempt to open it, then use **Open Anyway** in System Settings → Privacy & Security if macOS blocks it as unverified. Compare each download with \`SHA256SUMS.txt\`. See [macOS development signatures]($source_url/docs/development/packaging.md#macos-development-signatures) if it is reported as damaged.

          Built by [workflow run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID) after the full quality gate. The source code archives on this page hold the tagged source; [packaging]($source_url/docs/development/packaging.md) describes the build. Licensed under GPL-3.0-only.
          EOF
          } > notes.md
          cat notes.md
      - name: Publish the release
        run: |
          if [[ "$CHANNEL" == nightly ]]; then
            if gh release view nightly > /dev/null 2>&1; then
              gh release delete nightly --cleanup-tag --yes
            elif gh api "repos/$GH_REPO/git/ref/tags/nightly" > /dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/nightly"
            fi
            gh release create nightly release/* --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Vibe Tox LIS $VERSION" --notes-file notes.md
            tag=nightly
          else
            tag="v$VERSION"
            # A failed earlier attempt can leave an unpublished draft; drafts have no tag yet.
            gh api --paginate "repos/$GH_REPO/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id" |
              while read -r id; do gh api -X DELETE "repos/$GH_REPO/releases/$id"; done
            # Draft first, so the release becomes visible only with every asset attached.
            gh release create "$tag" release/* --draft --target "$GITHUB_SHA" \
              --title "Vibe Tox LIS $VERSION" --notes-file notes.md --generate-notes
            gh release edit "$tag" --draft=false --latest
          fi
          assets="$(gh release view "$tag" --json assets --jq '.assets | length')"
          if [[ "$assets" != 5 ]]; then
            echo "::error::$tag has $assets assets; expected 4 installers and SHA256SUMS.txt"
            exit 1
          fi
          echo "Published [$tag]($GITHUB_SERVER_URL/$GH_REPO/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"

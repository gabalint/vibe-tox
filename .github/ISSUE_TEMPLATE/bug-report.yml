name: Bug report
description: Something in the application, documentation or website does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is a development project tested on synthetic data only. Issues are public:
        never include patient information, real requisitions, analyzer or instrument exports,
        screenshots of real records, or credentials. Report vulnerabilities privately through
        the repository's Security tab.
  - type: checkboxes
    id: synthetic-only
    attributes:
      label: Data check
      options:
        - label: This report and its attachments contain only synthetic or made-up data and no credentials.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic data. Include the screen, command or document involved.
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: For example the output of `git rev-parse --short HEAD`.
  - type: input
    id: environment
    attributes:
      label: Operating system
      description: For example macOS 26, Windows 11 or Ubuntu 24.04.

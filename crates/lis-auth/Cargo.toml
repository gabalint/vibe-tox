[package]
name = "lis-auth"
description = "Local accounts, Argon2id passwords, TOTP MFA, sessions, roles and capabilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
# Feature anchor: webauthn-rs does not expose its OpenSSL vendored feature.
ignored = ["openssl"]

[dependencies]
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
lis-audit = { workspace = true }
lis-core = { workspace = true }
lis-store = { workspace = true }
openssl = { workspace = true }
qrcode = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
totp-rs = { workspace = true }
ts-rs = { workspace = true }
webauthn-rs = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
lis-store = { workspace = true, features = ["testing"] }
webauthn-authenticator-rs = { workspace = true, features = ["softpasskey"] }

[lints]
workspace = true

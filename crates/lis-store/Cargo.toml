[package]
name = "lis-store"
description = "SQLite system of record: single writer, BEGIN IMMEDIATE units of work, migrations, outbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Test fixtures for other crates' tests: enable from their [dev-dependencies].
testing = ["dep:tempfile"]

[dependencies]
hex = { workspace = true }
lis-audit = { workspace = true }
lis-core = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Enables the `testing` fixtures for this crate's own integration tests.
lis-store = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
